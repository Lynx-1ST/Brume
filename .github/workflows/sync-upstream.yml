name: Sync upstream
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - '.github/scripts/sync-upstream.mjs'

permissions:
  contents: read

concurrency:
  group: serein-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Lynx-1ST/Serein' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Merge upstream and request CI only when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-upstream.mjs
