name: Windows Release
run-name: Windows build by @${{ github.actor }}

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Serein Fork CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (for example 0.1.1); leave empty for a nightly build'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'Lynx-1ST/Serein' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      verified: ${{ steps.source.outputs.verified }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # workflow_run's github.sha is the trusted default branch, never the PR head.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check release source admission offline
        run: node --test tests/release-source.test.mjs
      - name: Resolve checked source and merge owner PR when CI passed
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-source.mjs

  build:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Pin and validate the release commit
        id: source
        env:
          RELEASE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          CI_SOURCE_SHA: ${{ needs.source.outputs.verified == 'true' && needs.source.outputs.sha || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $source = $env:RELEASE_SOURCE_SHA
          if ($source -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source commit.' }
          $current = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $current -ne $source) { throw 'Checkout does not match the verified source.' }
          $eligible = 'true'
          if ($env:CI_SOURCE_SHA) {
            $tip = & gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main.' }
            if ($tip.Trim() -ne $source) { $eligible = 'false' }
          }
          "eligible=$eligible" >> $env:GITHUB_OUTPUT
          "sha=$source" >> $env:GITHUB_OUTPUT
          "SOURCE_SHA=$source" >> $env:GITHUB_ENV
      - name: Choose package version
        if: steps.source.outputs.eligible == 'true'
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $base = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value.Split('-')[0]
          $version = "$env:REQUESTED_VERSION".Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif (!$version) {
            $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $version = "$base-nightly.$date.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-nightly\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))?$') {
            throw 'Expected a stable or nightly semantic version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@1.99.1
        if: steps.source.outputs.eligible == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        if: steps.source.outputs.eligible == 'true'
        with:
          # Keep optimized dependencies separate from CI's immutable debug cache.
          # This also restores the existing release cache from earlier fork builds.
          key: windows-release
          cache-on-failure: true
      - name: Install Windows packaging tools
        if: steps.source.outputs.eligible == 'true'
        run: choco install nsis --no-progress -y
      - name: Check offline demo targets
        if: steps.source.outputs.eligible == 'true' && github.event_name != 'workflow_run'
        run: cargo check --locked -p serein -p ui --all-targets --features serein/demo
      - name: Validate workspace
        if: steps.source.outputs.eligible == 'true' && github.event_name != 'workflow_run'
        run: cargo xtask check
      - name: Apply package version
        if: steps.source.outputs.eligible == 'true'
        run: python .github/release/version.py $env:VERSION
      - name: Build production package with voice
        if: steps.source.outputs.eligible == 'true'
        run: cargo xtask package
      - name: Collect installer, executable and portable archive
        if: steps.source.outputs.eligible == 'true'
        run: |
          $asset = "serein-$env:TAG-Windows-X64"
          New-Item -ItemType Directory release-assets | Out-Null
          if (!(Test-Path -LiteralPath 'dist/serein.exe')) { throw 'Missing production executable.' }
          $installers = @(Get-ChildItem -Path 'dist-installer/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/$asset-Setup.exe"
          Copy-Item -LiteralPath 'dist/serein.exe' -Destination "release-assets/$asset.exe"
          Compress-Archive -Path 'dist/*' -DestinationPath "release-assets/$asset.zip" -CompressionLevel Optimal
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      eligible: ${{ steps.source.outputs.eligible }}

  publish:
    needs: build
    if: needs.build.outputs.eligible == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-release
          path: release-assets
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          VERIFIED_SOURCE: ${{ github.event_name == 'workflow_run' }}
        run: |
          if ($env:VERIFIED_SOURCE -eq 'true') {
            $tip = & gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main before publication.' }
            if ($tip.Trim() -ne $env:SOURCE_SHA) {
              'Main changed during the build; leaving the package as an Actions artifact.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
          }
          $notes = @"
          Bản Windows x64 của fork này, dựng từ commit $env:SOURCE_SHA.

          ### Tải về

          | Tệp | Dùng khi nào |
          | --- | --- |
          | **-Setup.exe** | Cài cho tài khoản Windows hiện tại. Phù hợp với phần lớn người dùng. |
          | **.zip** | Bản portable. Giải nén vào thư mục có quyền ghi rồi chạy ``serein.exe``. |
          | **.exe** | Chạy thẳng, không cài. Dùng ``.zip`` nếu cần cả tài liệu và công cụ kèm theo. |
          | **SHA256SUMS.txt** | Đối chiếu mã băm của tệp vừa tải. |

          Mọi gói đều có sẵn thoại và không kèm dữ liệu demo. Đăng nhập cần **Microsoft Edge
          WebView2 Runtime**. Các tệp này **chưa được ký mã**, nên Windows SmartScreen có thể
          cảnh báo ở lần chạy đầu.

          Bật tiếng Việt: **Settings → Language & Time → Display language → Tiếng Việt**.

          ### Fork này khác bản gốc ở đâu

          **Tiếng Việt** — catalog đầy đủ, gồm cả bảng xử lý âm thanh đầu vào và nhãn
          DeepFilterNet. Thuật ngữ rà theo ngữ cảnh Discord, ngày giờ theo định dạng Việt Nam.

          **Thoại và mic** — lọc tạp âm DeepFilterNet với chế độ tự chuyển về RNNoise khi máy
          không kham nổi; độ nhạy mic tự động; nhận diện giọng nói nâng cao; xác nhận trước khi
          chuyển kênh thoại. Cảnh báo mic câm đo mức tín hiệu thô từ thiết bị, nên lọc tạp âm và
          cổng nhận diện không còn làm nó báo nhầm khi bạn chỉ đang im lặng.

          **Stream** — xem tối đa bốn stream cùng lúc, Picture-in-Picture kéo và đổi kích thước
          được, chỉnh độ phân giải/FPS khi đang chia sẻ mà không rớt thoại. Âm thanh stream không
          còn bị xóa sạch bộ đệm mỗi khi vòng lặp thoại chạy trễ, vốn là nguyên nhân gây hụt tiếng
          dồn vài lần liên tiếp lúc máy tải nặng.

          **Hiệu năng** — chọn ngân sách bộ nhớ hình cho card đồ họa trong **Settings → Storage**
          (32–192 MB, mặc định 96 MB giữ nguyên hành vi cũ). Avatar và sticker động vẽ nhỏ hơn
          kích thước gốc không còn nạp thừa một texture mỗi khung hình.

          **Khác** — chat ngay trong kênh thoại, tag máy chủ cho người đang trong voice, thanh
          thành viên kéo được, emoji nét hơn ở DPI cao, gợi ý nhắc tên dùng đúng biệt danh máy chủ.

          ### Cần biết

          - Âm thanh stream hiện được giải mã **mono**; stream stereo bị trộn xuống một kênh.
          - Schema cache cục bộ là **30**. Client schema 29 cũ không mở lại được cache đã nâng.
          - Serein là ứng dụng **không chính thức**, không được Discord chứng thực.

          Danh sách commit đầy đủ của bản này nằm ở liên kết **Compare** phía trên.
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $releaseArgs = @('release', 'create', $env:TAG, '--repo', $env:GH_REPO,
            '--target', $env:SOURCE_SHA, '--title', "Serein $env:VERSION (Windows)",
            '--notes-file', 'release-notes.md')
          if ($env:VERSION.Contains('-nightly.')) { $releaseArgs += @('--prerelease', '--latest=false') }
          $releaseArgs += @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

  next-pr:
    needs: [build, publish]
    if: github.event_name == 'workflow_run' && needs.publish.result == 'success' && needs.build.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Trusted default-branch code from this workflow_run, never PR code with write tokens.
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node --test tests/advance-release-queue.test.mjs
      - name: Start decoration CI only after PR 12 Windows assets are published
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: node .github/scripts/advance-release-queue.mjs
