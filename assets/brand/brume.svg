<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Brume gradient app icon</title>
  <desc>Brume mist-stripe app icon. Four horizontal stripes of staggered length are cut out of a rounded plate, suggesting drifting mist. Cleanly padded and anti-aliased with no outer border artifacts.</desc>
  <defs>
  <linearGradient id="bg" x1="100" y1="52" x2="760" y2="972" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8BBEFF"/>
    <stop offset="0.30" stop-color="#506DDC"/>
    <stop offset="0.65" stop-color="#303D9C"/>
    <stop offset="1" stop-color="#2D247C"/>
  </linearGradient>
  <radialGradient id="glow" cx="1060" cy="970" r="720" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#5625A5" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#5625A5" stop-opacity="0"/>
  </radialGradient>
  <mask id="mist">
    <rect x="52" y="52" width="920" height="920" rx="200" fill="white"/>
    <rect x="220" y="312" width="480" height="56" rx="28" fill="black"/>
    <rect x="280" y="427" width="560" height="56" rx="28" fill="black"/>
    <rect x="200" y="542" width="520" height="56" rx="28" fill="black"/>
    <rect x="310" y="657" width="450" height="56" rx="28" fill="black"/>
  </mask>
  </defs>
  <g mask="url(#mist)">
    <rect x="52" y="52" width="920" height="920" rx="200" fill="url(#bg)"/>
    <rect x="52" y="52" width="920" height="920" rx="200" fill="url(#glow)"/>
  </g>
</svg>
